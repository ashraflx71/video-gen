<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محرر الفيديوهات ومولد المؤثرات (Video Gen)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; padding:12px; font-family: Arial, Tahoma, sans-serif; background:#111; color:#fff; }
  h1 { font-size:18px; text-align:center; margin:0 0 12px; }
  .box { background:#1c1c1c; border-radius:10px; padding:10px; margin-bottom:10px; }
  canvas { width:100%; height:auto; background:#000; border-radius:8px; display:block; }
  input[type=text] { width:100%; padding:10px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; font-size:16px; }
  input[type=file] { width:100%; color:#ccc; }
  .row { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  button { flex:1 1 40%; padding:12px; border:0; border-radius:8px; background:#2d7ff9; color:#fff; font-size:15px; }
  button.active { background:#1fa35b; }
  button.alt { background:#555; }
  button:disabled { opacity:.5; }
  #status { font-size:13px; color:#9f9; min-height:18px; margin-top:6px; }
  #debug { color:#0f0; background:#000; font-size:11px; white-space:pre-wrap; max-height:100px; overflow:auto; margin:0; border-radius:8px; padding:6px; }
  .note { font-size:12px; color:#aaa; margin:8px 0 0; }
</style>
</head>
<body>
<h1>🎥 محرر الفيديوهات ومولد المؤثرات (Video Gen)</h1>

<div class="box">
  <input type="file" id="uploadVideo" accept="video/*">
  <div id="status">اختر فيديو للبدء</div>
</div>

<div class="box">
  <canvas id="videoCanvas" width="640" height="360"></canvas>
  <div class="row">
    <button id="playBtn" class="alt">⏯ تشغيل / إيقاف</button>
    <button id="exportBtn">⬇ تصدير الفيديو</button>
  </div>
  <p class="note">أثناء التصدير أبقِ الشاشة مضيئة والصفحة مفتوحة حتى ينتهي.</p>
</div>

<div class="box">
  <input type="text" id="overlayText" placeholder="اكتب النص هنا">
  <div class="row">
    <button id="addTextBtn">إضافة النص</button>
    <button id="clearTextBtn" class="alt">حذف النص</button>
  </div>
</div>

<div class="box">
  <div>التأثيرات المرئية:</div>
  <div class="row" id="filters">
    <button data-filter="none" class="active">عادي</button>
    <button data-filter="grayscale(100%)">أبيض وأسود</button>
    <button data-filter="sepia(100%)">سيبيا</button>
    <button data-filter="contrast(180%)">تباين عالٍ</button>
  </div>
</div>

<pre id="debug"></pre>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const canvas = $('videoCanvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const statusEl = $('status');
  const dbg = $('debug');
  const exportBtn = $('exportBtn');
  const log = m => { dbg.textContent += m + '\n'; dbg.scrollTop = dbg.scrollHeight; };
  const setStatus = m => { statusEl.textContent = m; };

  window.addEventListener('error', e => log('خطأ JS: ' + e.message + ' (سطر ' + e.lineno + ')'));
  window.addEventListener('unhandledrejection', e => log('خطأ: ' + (e.reason && e.reason.message || e.reason)));

  const video = document.createElement('video');
  video.muted = true;
  video.playsInline = true;
  video.setAttribute('playsinline', '');
  video.preload = 'auto';
  video.loop = false;

  let currentText = '';
  let currentFilter = 'none';
  let recorder = null;
  let exporting = false;
  const MAX_W = 720;

  // ===== هل المتصفح يدعم ctx.filter فعلًا؟ (سفاري/آيفون لا يدعمه) =====
  const supportsCtxFilter = (() => {
    try {
      const c = document.createElement('canvas');
      c.width = c.height = 1;
      const x = c.getContext('2d');
      x.filter = 'grayscale(100%)';
      x.fillStyle = '#ff0000';
      x.fillRect(0, 0, 1, 1);
      const d = x.getImageData(0, 0, 1, 1).data;
      return Math.abs(d[0] - d[1]) < 8 && Math.abs(d[1] - d[2]) < 8;
    } catch (_) { return false; }
  })();
  log('دعم الفلاتر المباشر: ' + (supportsCtxFilter ? 'نعم' : 'لا (سيتم الحساب يدويًا)'));

  // ===== تحميل الفيديو =====
  $('uploadVideo').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (video.src) URL.revokeObjectURL(video.src);
    setStatus('جاري التحميل: ' + file.name);
    log('الملف: ' + file.name + ' | ' + file.type + ' | ' + Math.round(file.size / 1024) + ' KB');
    video.src = URL.createObjectURL(file);
    video.load();
  });

  video.addEventListener('loadedmetadata', () => {
    const w = video.videoWidth, h = video.videoHeight;
    log('الأبعاد: ' + w + 'x' + h);
    if (!w || !h) { setStatus('تعذر قراءة أبعاد الفيديو'); return; }
    const scale = Math.min(1, MAX_W / w);
    canvas.width = Math.round(w * scale) & ~1;
    canvas.height = Math.round(h * scale) & ~1;
  });

  video.addEventListener('loadeddata', () => {
    setStatus('تم التحميل ✓');
    video.play().catch(err => { log('التشغيل: ' + err.message); setStatus('اضغط تشغيل'); });
  });

  video.addEventListener('error', () => {
    const codes = { 1: 'أُلغي', 2: 'شبكة', 3: 'فشل فك الترميز', 4: 'الصيغة/الترميز غير مدعوم' };
    const c = video.error ? video.error.code : '?';
    log('خطأ الفيديو: ' + (codes[c] || c));
    setStatus('تعذر تشغيل الفيديو. جرّب MP4 بترميز H.264');
  });

  // ===== تشغيل / إيقاف =====
  $('playBtn').addEventListener('click', () => {
    if (!video.src || exporting) return;
    if (video.ended) video.currentTime = 0;
    video.paused ? video.play().catch(err => log(err.message)) : video.pause();
  });

  // ===== النص =====
  $('addTextBtn').addEventListener('click', () => { currentText = $('overlayText').value.trim(); });
  $('clearTextBtn').addEventListener('click', () => { currentText = ''; $('overlayText').value = ''; });

  // ===== الفلاتر =====
  $('filters').addEventListener('click', e => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    currentFilter = btn.dataset.filter;
    document.querySelectorAll('#filters button').forEach(b => b.classList.toggle('active', b === btn));
  });

  // فلتر يدوي للمتصفحات التي لا تدعم ctx.filter
  function applyPixelFilter() {
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = img.data;
    const f = currentFilter;
    for (let i = 0; i < d.length; i += 4) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      if (f.startsWith('grayscale')) {
        const y = 0.299 * r + 0.587 * g + 0.114 * b;
        d[i] = d[i + 1] = d[i + 2] = y;
      } else if (f.startsWith('sepia')) {
        d[i]     = Math.min(255, 0.393 * r + 0.769 * g + 0.189 * b);
        d[i + 1] = Math.min(255, 0.349 * r + 0.686 * g + 0.168 * b);
        d[i + 2] = Math.min(255, 0.272 * r + 0.534 * g + 0.131 * b);
      } else if (f.startsWith('contrast')) {
        d[i]     = Math.max(0, Math.min(255, (r - 128) * 1.8 + 128));
        d[i + 1] = Math.max(0, Math.min(255, (g - 128) * 1.8 + 128));
        d[i + 2] = Math.max(0, Math.min(255, (b - 128) * 1.8 + 128));
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // ===== رسم النص =====
  function wrapLines(text, maxW) {
    const words = text.split(/\s+/).filter(Boolean);
    const lines = [];
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; }
      else line = t;
    }
    if (line) lines.push(line);
    return lines;
  }

  function drawText() {
    if (!currentText) return;
    const size = Math.max(18, Math.round(canvas.width / 16));
    ctx.save();
    ctx.font = 'bold ' + size + 'px Arial, Tahoma, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const lines = wrapLines(currentText, canvas.width * 0.88);
    const lineH = size * 1.35;
    const boxH = lines.length * lineH + size * 0.6;
    const boxW = Math.min(canvas.width, Math.max(...lines.map(l => ctx.measureText(l).width)) + size);
    const top = canvas.height - boxH - canvas.height * 0.05;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect((canvas.width - boxW) / 2, top, boxW, boxH);
    ctx.fillStyle = '#fff';
    lines.forEach((l, i) => {
      ctx.fillText(l, canvas.width / 2, top + size * 0.3 + lineH * (i + 0.5));
    });
    ctx.restore();
  }

  // ===== حلقة الرسم (هذا ما كان ناقصًا) =====
  function draw() {
    if (video.readyState >= 2 && video.videoWidth) {
      ctx.save();
      ctx.filter = supportsCtxFilter ? currentFilter : 'none';
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      ctx.restore();
      if (!supportsCtxFilter && currentFilter !== 'none') applyPixelFilter();
    } else {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    drawText();
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ===== الصوت للتصدير =====
  let audioCtx = null, audioDest = null;
  function getAudioTracks() {
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AC();
        const src = audioCtx.createMediaElementSource(video);
        audioDest = audioCtx.createMediaStreamDestination();
        src.connect(audioDest); // لا نوصله بالسماعات حتى لا يُسمع الصوت أثناء التصدير
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioDest.stream.getAudioTracks();
    } catch (err) {
      log('الصوت غير متاح: ' + err.message);
      return [];
    }
  }

  function pickMime() {
    const list = [
      'video/mp4;codecs=avc1.42E01E,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    return list.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
  }

  function waitSeek() {
    return new Promise(res => {
      if (Math.abs(video.currentTime) < 0.01) return res();
      const done = () => { video.removeEventListener('seeked', done); res(); };
      video.addEventListener('seeked', done);
      setTimeout(done, 1500);
      video.currentTime = 0;
    });
  }

  // ===== التصدير =====
  exportBtn.addEventListener('click', async () => {
    if (exporting) return;
    if (!video.src || !video.videoWidth) { setStatus('اختر فيديو أولًا'); return; }
    if (!window.MediaRecorder || !canvas.captureStream) {
      setStatus('هذا المتصفح لا يدعم التصدير. جرّب Chrome');
      return;
    }

    exporting = true;
    exportBtn.disabled = true;
    const mime = pickMime();
    const stream = canvas.captureStream(30);
    video.muted = false; // الصوت يذهب للتسجيل فقط وليس للسماعات
    getAudioTracks().forEach(t => stream.addTrack(t));

    const chunks = [];
    try {
      recorder = new MediaRecorder(stream, mime
        ? { mimeType: mime, videoBitsPerSecond: 4000000 }
        : undefined);
    } catch (err) {
      log('فشل المسجل: ' + err.message);
      finishExport();
      setStatus('تعذر بدء التصدير');
      return;
    }

    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const type = recorder.mimeType || mime || 'video/webm';
      const ext = type.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type });
      if (!blob.size) { setStatus('التصدير فشل: الملف فارغ'); finishExport(); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'video-gen.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      setStatus('تم التصدير ✓ (' + ext + ')');
      log('حجم الملف: ' + Math.round(blob.size / 1024) + ' KB');
      finishExport();
    };
    recorder.onerror = e => { log('خطأ المسجل: ' + (e.error && e.error.message)); };

    function onTime() {
      if (video.duration) setStatus('جاري التصدير... ' + Math.round(video.currentTime / video.duration * 100) + '%');
    }
    function onEnded() {
      video.removeEventListener('ended', onEnded);
      video.removeEventListener('timeupdate', onTime);
      if (recorder && recorder.state !== 'inactive') recorder.stop();
    }
    function finishExport() {
      video.removeEventListener('ended', onEnded);
      video.removeEventListener('timeupdate', onTime);
      video.muted = true;
      exporting = false;
      recorder = null;
      exportBtn.disabled = false;
    }

    video.pause();
    await waitSeek();
    video.addEventListener('ended', onEnded);
    video.addEventListener('timeupdate', onTime);
    recorder.start(500);
    try {
      await video.play();
    } catch (err) {
      log('التشغيل: ' + err.message);
      if (recorder.state !== 'inactive') recorder.stop();
      setStatus('تعذر التشغيل للتصدير');
    }
  });
})();
</script>
</body>
</html>
