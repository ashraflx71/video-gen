<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gen - محرر الفيديوهات الذكي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎥 محرر الفيديوهات ومولد المؤثرات (Video Gen)</h1>
    
    <!-- منطقة المعاينة واللوحة -->
    <div class="preview-area">
      <canvas id="videoCanvas" width="800" height="450"></canvas>
    </div>

    <!-- شريط التحكم والأدوات -->
    <div class="controls">
      <!-- رفع الفيديو -->
      <input type="file" id="uploadVideo" accept="video/*">
      
      <!-- إضافة نص فوق الفيديو -->
      <div class="text-tools">
        <input type="text" id="overlayText" placeholder="اكتب نصاً ليظهر فوق الفيديو...">
        <button id="addTextBtn">إضافة النص</button>
      </div>

      <!-- الفلترات والتأثيرات -->
      <div class="filter-tools">
        <label>التأثيرات المرئية:</label>
        <button onclick="applyFilter('none')">عادي</button>
        <button onclick="applyFilter('grayscale(100%)')">أبيض وأسود</button>
        <button onclick="applyFilter('sepia(100%)')">سيبيا (كلاسيكي)</button>
        <button onclick="applyFilter('contrast(150%)')">تباين عالٍ</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="app.js"></script>
</body>
</html>
