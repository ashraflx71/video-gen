<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Gen - محرر الفيديوهات الذكي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🎥 محرر الفيديوهات ومولد المؤثرات (Video Gen)</h1>
    
    <!-- منطقة المعاينة واللوحة -->
    <div class="preview-area">
      <video id="sourceVideo" style="display:none;" crossorigin="anonymous" playsinline></video>
      <canvas id="videoCanvas" width="800" height="450"></canvas>
    </div>

    <!-- شريط التحكم والأدوات -->
    <div class="controls">
      <!-- رفع الفيديو -->
      <div class="upload-section">
        <label for="uploadVideo" class="upload-btn">اختر فيديو للتحميل</label>
        <input type="file" id="uploadVideo" accept="video/*">
      </div>
      
      <!-- إضافة نص فوق الفيديو -->
      <div class="text-tools">
        <input type="text" id="overlayText" placeholder="اكتب نصاً ليظهر فوق الفيديو...">
        <button id="addTextBtn">إضافة النص</button>
      </div>

      <!-- الفلترات والتأثيرات -->
      <div class="filter-tools">
        <label>التأثيرات المرئية:</label>
        <button class="filter-btn" data-filter="none">عادي</button>
        <button class="filter-btn" data-filter="grayscale(100%)">أبيض وأسود</button>
        <button class="filter-btn" data-filter="sepia(100%)">سيبيا (كلاسيكي)</button>
        <button class="filter-btn" data-filter="contrast(150%)">تباين عالٍ</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
